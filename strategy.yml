claims:
  - id: c1
    content: "The dispatch spine is: Parser -> Dispatcher -> Verb (pure, returns events) -> Dispatcher applies events (Ecto.Multi) + broadcasts (PubSub)"
    source:
      type: input
      ref: i4
  - id: c2
    content: "Everything is an object in one table. Type from ancestry, not enum. UUIDs everywhere. Properties are JSONB-wrapped. Soft deletes only."
    source:
      type: input
      ref: i4
  - id: c3
    content: "Verbs are objects attached to other objects. Verb execute/2 is pure. Returns events only."
    source:
      type: input
      ref: i4
  - id: c4
    content: "Dispatcher owns ALL side effects. Persistence and notification happen there and nowhere else. Ecto.Multi atomic transactions."
    source:
      type: input
      ref: i4
  - id: c5
    content: "Inheritance (parent_id) and containment (relationship) are two completely independent hierarchies. Never conflate them."
    source:
      type: input
      ref: i6
  - id: c6
    content: "Verb search order: player -> room -> dobj -> iobj, each walking parent chain. Argument specifiers: dobj/prep/iobj with none/any/this values."
    source:
      type: input
      ref: i7
  - id: c7
    content: "Movement protocol: accept verb -> loop check -> remove old containment -> add new containment -> exitfunc -> enterfunc."
    source:
      type: input
      ref: i8
  - id: c8
    content: "Exits are full objects. Doors are multi-contained (in both rooms). Direction on containment edge, lock state on exit object."
    source:
      type: input
      ref: i8
  - id: c9
    content: "8 chargen attributes: opposition pairs Wire-Shade, Grit-Face, Wit-Iron, plus independent Rigor and Vigor. Set at chargen."
    source:
      type: input
      ref: i9
  - id: c10
    content: "19 skills as objects descended from $skill. Total = stat_a + stat_b. Combat skills have separate attack_speed_stat (Vigor melee, Rigor ranged)."
    source:
      type: input
      ref: i10
  - id: c11
    content: "3 health bars: HP (Iron-scaled), Fatigue (Vigor-scaled), Stress (flat cap, rate-scaled by behavior/environment)."
    source:
      type: input
      ref: i11
  - id: c12
    content: "4 core stats: Faction Rep (per-faction), Social Clout (Signal upload driven), Money (Dirham+Yuan), Signal (upload+download bandwidth)."
    source:
      type: input
      ref: i12
  - id: c13
    content: "Umbrella: line_shared (library) < line_core (MOO core) < line_web (Phoenix). line_world and line_ml depend on line_core+line_shared."
    source:
      type: input
      ref: i1
  - id: c14
    content: "Stack: Elixir 1.16+/OTP 26+, Phoenix 1.7+, PostgreSQL via Ecto, Bandit HTTP. No frontend build pipeline."
    source:
      type: input
      ref: i1
  - id: c15
    content: "Integration notes confirm: object graph + verb dispatch + PubSub form the spine. Verification sequence: create room, create player, place in room, dispatch look."
    source:
      type: input
      ref: i13
  - id: c16
    content: "Inheritance tree: $root -> $room, $exit, $motile -> $mob -> $human -> $pc/$npc, $immobile, $wieldable, $skill -> 19 children"
    source:
      type: input
      ref: i5
  - id: c17
    content: "Ancestry queries determine type. Three options given: walk parent chain, materialized path/closure table, cached archetype tag. Spec says start simple."
    source:
      type: input
      ref: i6
  - id: c18
    content: "The object graph has zero dependencies on other subsystems. It is the base layer."
    source:
      type: inference
      premises: [c2, c5, c13]
  - id: c19
    content: "Verb dispatch depends on objects but NOT on character mechanics, containment specifics, or the web layer."
    source:
      type: inference
      premises: [c3, c6, c1]
  - id: c20
    content: "Containment depends on objects and the dispatcher. Independent of character mechanics."
    source:
      type: inference
      premises: [c5, c7, c8, c4]
  - id: c21
    content: "Character data are properties on objects. They need the object graph for storage but not the dispatcher for definition."
    source:
      type: inference
      premises: [c9, c10, c11, c12, c2]
  - id: c22
    content: "The web layer subscribes to PubSub topics from line_core. Can be built incrementally."
    source:
      type: inference
      premises: [c13, c14, c15]
  - id: c23
    content: "Phase 1 was gated with replace because 5 claims were lazily grounded in priors instead of in the docs."
    source:
      type: input
      ref: i15
  - id: c24
    content: "The learned assessment predicted bad despite pass+replace. Phase 2 should be tighter."
    source:
      type: inference
      premises: [c23, c18]

modes:
  - mode: perception
    artifact_id: a1
    references: [i1, i2, i4, i5, i6, i7, i8, i9, i10, i11, i12, i13, i14, i15]
    artifact: "Re-read all docs without Phase 1 assumptions. Observed: 13 design documents define a MOO with a clean DAG architecture. The spine (parser->dispatcher->verb->events) is load-bearing. Two independent hierarchies (inheritance, containment). Character mechanics are data-on-objects, not structural dependencies. Phase 1 result confirms grounding discipline matters more than plan breadth."
  - mode: evaluation
    artifact_id: a2
    references: [i4, i5, i7, i8, i15]
    artifact: "Criteria: can each build phase be independently verified through the dispatch spine? Phase 1 (objects): yes, via property CRUD and ancestry queries. Phase 2 (verbs): yes, via dispatching look. Phase 3 (containment): yes, via go/get/drop. Phase 4 (character): yes, via chargen. Phase 5 (combat): yes, via attack verb. Phase 6 (web): yes, via channel connection. Assessment: the phasing is sound."
  - mode: abduction
    artifact_id: a3
    references: [i4, i13, i15]
    artifact: "Hypothesis: the learned assessment flagged bad because the Phase 1 plan tried to specify implementation details before the harness validated the structural reasoning. A better plan specifies WHAT and WHY at the strategic level and defers HOW to operational execution. Falsifiable by: a plan with less implementation detail but the same structure getting a good assessment."
  - mode: counterfactual
    artifact_id: a4
    references: [i4, i8, i10]
    artifact: "Counterfactual: what if we built character mechanics before containment? Combat verbs need spatial awareness (same room checks). Without containment, combat verbs would skip room-presence checks, violating the movement protocol. Conclusion: containment before character mechanics is correct."

action:
  id: act1
  type: decision
  grounded_in: [c1, c2, c3, c4, c5, c6, c7, c8, c9, c10, c11, c12, c13, c14, c15, c16, c17, c18, c19, c20, c21, c22, c23, c24]
  description: |
    BUILD STRATEGY - LINE IN THE SAND
    Six phases. Each builds on the previous. Each has a concrete verification gate.
    The dependency chain is: objects -> verbs -> containment -> character data -> combat -> web.

    PHASE 1: OBJECT GRAPH
    What: Single objects table with UUID PKs, JSONB properties, directed relationships.
    Where: line_shared (well-known IDs, constants), line_core (schemas, Object module, seed)
    Gate: Create $room child, set property on it, read inherited property from $room. All pass.

    PHASE 2: VERB DISPATCH
    What: Parser, Dispatcher, Verb behaviour, verb search across object tree.
    Where: line_core (Parser, Dispatcher, Verb, PubSub, Context)
    Gate: Dispatch look for a player in a room. Receive rendered description via PubSub.

    PHASE 3: CONTAINMENT AND MOVEMENT
    What: Movement protocol, multi-containment for doors. Verbs: go, get, drop, put, wield, unwield.
    Where: line_core (dispatcher move handler, verb modules)
    Gate: Player moves through connected rooms. Gets item. Wields weapon.

    PHASE 4: CHARACTER SYSTEM
    What: 8 chargen attributes, 19 skill objects, HP/Fatigue/Stress bars, core stats.
    Where: line_core (chargen module), line_shared (attribute/skill constants)
    Gate: Create character via chargen. Verify skill totals match attribute sums.

    PHASE 5: GAME VERBS AND WORLD
    What: Combat verbs, fatigue costs, hacking verbs, craft verbs, social verbs, death protocol.
    Where: line_core (verb modules), line_world (state transitions, world rules)
    Gate: Full combat round resolves. Death protocol fires.

    PHASE 6: WEB INTERFACE
    What: Phoenix GameChannel subscribing to PubSub topics per player.
    Where: line_web
    Gate: Connect via browser. Type look. See room description. Type go north. Move rooms.

